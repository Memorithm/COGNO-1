[package]
name = "cogno-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface for COGNO-1."

[[bin]]
name = "cogno"
path = "src/main.rs"

[dependencies]
cogno-core = { workspace = true }
cogno-runtime = { workspace = true }
cogno-transport = { workspace = true }
cogno-model = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Lint policy is declared at the top of src/main.rs.
