[package]
name = "cogno-scirust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "COGNO-owned local differentiable backend (legacy compatibility crate name); bounded safe Rust, not the canonical Memorithm SciRust implementation."

[lib]
name = "cogno_scirust"
path = "src/lib.rs"

[dependencies]
cogno-core = { workspace = true }

# COGNO-1 V2 §24 supply-chain policy: this crate adds NO external dependency.
# The historical crates.io scirust 0.0.5 evaluation was NOT an evaluation of
# Memorithm/scirust. The name is retained for compatibility only. Canonical
# scalar forward qualification runs separately, without changing the shipped
# dependency graph or claiming complete autograd convergence; see
# docs/SCIRUST_QUALIFICATION.md and docs/DEPENDENCIES.md.
#
# Lint policy is declared at the top of src/lib.rs.
