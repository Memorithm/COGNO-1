name: rustfmt-once-pr24

on:
  push:
    branches:
      - feat/controlled-meta-activation-seal

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/controlled-meta-activation-seal
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: apply exact Rust 1.97.1 formatting
        run: cargo fmt --all
      - name: commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply rustfmt 1.97.1"
          git push origin HEAD:feat/controlled-meta-activation-seal
