name: Offline distribution
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Packaging unit tests
        run: python3 -m unittest discover -s scripts -p 'test_offline_bundle.py' -v
      - name: Evidence verification unit tests
        run: python3 -m unittest discover -s scripts -p 'test_bpe_evidence.py' -v
      - name: Corpus admission unit tests
        run: python3 -m unittest discover -s scripts -p 'test_rust_corpus.py' -v
      - name: External panel integrity tests
        run: python3 -m unittest discover -s scripts -p 'test_external_rust_panel.py' -v
      - name: Prepare locked source distribution
        run: python3 scripts/offline_bundle.py pack "$RUNNER_TEMP/cogno-offline"
      - name: Build, test and train without network or Cargo cache
        run: |
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          sudo --preserve-env=PATH,RUSTUP_HOME unshare --net -- python3 scripts/offline_bundle.py verify "$RUNNER_TEMP/cogno-offline"
