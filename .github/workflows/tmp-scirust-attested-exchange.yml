name: Temporary SciRust attested exchange qualifier

on:
  push:
    branches:
      - fix/scirust-attested-exchange-boundary

permissions:
  contents: write

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/scirust-attested-exchange-boundary
          fetch-depth: 0
      - name: Wire exports and fail-closed autonomy expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/cogno-runtime/src/lib.rs')
          s = lib.read_text()
          old = '''pub use scientific_exchange::{\n    classify_scientific_exchange, ScientificExchangeDisposition, ScientificExchangeError,\n    ScientificExchangeOrigin, ScientificExchangeRecord, ScientificExchangeVerdict,\n    MAX_SCIENTIFIC_EXCHANGE_PAYLOAD_BYTES,\n};'''
          new = '''pub use scientific_exchange::{\n    classify_attested_scientific_exchange, classify_scientific_exchange,\n    HostSciRustExecutionAttestation, ScientificExchangeDisposition, ScientificExchangeError,\n    ScientificExchangeOrigin, ScientificExchangeRecord, ScientificExchangeVerdict,\n    MAX_SCIENTIFIC_EXCHANGE_PAYLOAD_BYTES,\n};'''
          if s.count(old) != 1:
              raise SystemExit('scientific_exchange re-export anchor mismatch')
          lib.write_text(s.replace(old, new, 1))

          autonomy = Path('crates/cogno-runtime/src/taste_autonomy.rs')
          s = autonomy.read_text()
          old = '        assert_eq!(report.accepted_validations, 2);\n'
          new = '''        // The unauthenticated batch path must not promote a caller-supplied\n        // SciRust deterministic origin. Only the explicit user action is a\n        // validation here; attested runtime evidence uses the dedicated boundary.\n        assert_eq!(report.runtime_observations, 1);\n        assert_eq!(report.accepted_validations, 1);\n'''
          if s.count(old) != 1:
              raise SystemExit('autonomy expectation anchor mismatch')
          autonomy.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Qualify runtime boundary
        run: |
          cargo +1.97.1 fmt --all -- --check || cargo +1.97.1 fmt --all
          cargo +1.97.1 clippy -p cogno-runtime --all-targets -- -D warnings
          cargo +1.97.1 test -p cogno-runtime scientific_exchange
          cargo +1.97.1 test -p cogno-runtime autonomous_pass_quarantines_model_and_promotes_only_non_model_evidence
          cargo +1.97.1 test -p cogno-runtime
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/tmp-scirust-attested-exchange.yml
          git config user.name 'CHECKUPAUTO'
          git config user.email '194770978+CHECKUPAUTO@users.noreply.github.com'
          git add crates/cogno-runtime/src/lib.rs crates/cogno-runtime/src/scientific_exchange.rs crates/cogno-runtime/src/taste_autonomy.rs
          git commit -m 'fix(runtime): seal SciRust deterministic exchange authority'
          git push origin HEAD:fix/scirust-attested-exchange-boundary
