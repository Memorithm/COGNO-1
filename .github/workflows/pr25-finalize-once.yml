name: pr25-finalize-once

on:
  push:
    branches:
      - feat/controlled-model-generation-persistence

permissions:
  contents: write
  pull-requests: write

env:
  RUSTFLAGS: -D warnings

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/controlled-model-generation-persistence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: formatting
        run: cargo fmt --all -- --check
      - name: locked tests
        run: cargo test --locked --workspace --all-targets
      - name: locked clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: locked docs
        run: cargo doc --locked --workspace --no-deps
      - name: dependency inventory
        run: |
          python3 - <<'PY'
          import pathlib, re
          lock = pathlib.Path('Cargo.lock').read_text()
          docs = pathlib.Path('docs/DEPENDENCIES.md').read_text()
          packages = []
          blocks = lock.split('[[package]]')[1:]
          for block in blocks:
              if 'source = "registry+' not in block:
                  continue
              m = re.search(r'^name = "([^"]+)"', block, re.M)
              if m:
                  packages.append(m.group(1))
          missing = sorted({p for p in packages if p not in docs})
          if missing:
              raise SystemExit('undocumented external dependencies: ' + ', '.join(missing))
          PY
      - name: prefetch locked dependencies
        run: cargo fetch --locked
      - name: frozen release build
        run: cargo build --frozen --release
      - name: self-delete finalizer and publish exact merge head
        run: |
          rm -f .github/workflows/pr25-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "ci: finalize PR25 after exact green gates"
          git push origin HEAD:feat/controlled-model-generation-persistence
      - name: merge exact validated head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/25/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA"
