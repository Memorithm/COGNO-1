name: pr25-gate-once

on:
  push:
    branches:
      - feat/controlled-model-generation-persistence

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/controlled-model-generation-persistence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: exact formatting gate
        run: cargo fmt --all -- --check
      - name: locked tests
        run: cargo test --locked --workspace --all-targets
      - name: locked clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: locked docs
        run: cargo doc --locked --workspace --no-deps
      - name: prefetch locked dependencies
        run: cargo fetch --locked
      - name: frozen release build
        run: cargo build --frozen --release
      - name: self-delete helper after successful gates
        run: |
          rm .github/workflows/pr25-gate-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "ci: confirm PR25 exact Rust gates"
          git push origin HEAD:feat/controlled-model-generation-persistence
