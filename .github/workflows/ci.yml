name: CI

# COGNO-1 V2 §24 — chaîne d'approvisionnement:
#   - conserver Cargo.lock ;
#   - exécuter la CI avec --locked ;
#   - tester les constructions hors réseau avec --frozen lorsque possible ;
#   - minimiser et documenter les dépendances ;
#   - `#![forbid(unsafe_code)]` dans tout code propriétaire.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy --locked -- -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: clippy (all targets, locked)
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: cargo test --locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: cargo test (all targets, locked)
        run: cargo test --all-targets --locked

  frozen:
    name: cargo build --frozen --release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: prefetch locked dependencies
        run: cargo fetch --locked
      - name: build offline (frozen) — §24 hors réseau
        run: cargo build --release --frozen --all-targets

  doc:
    name: cargo doc --locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: cargo doc (no-deps, locked)
        run: cargo doc --no-deps --locked

  dependency-policy:
    name: documented external dependencies (§24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: verify locked dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          actual="$(grep -E '^name = "' Cargo.lock | sed 's/name = "//; s/"//' | grep -v '^cogno-' | sort -u)"
          expected="$(cat <<'EOF' | sort -u
          block-buffer
          cfg-if
          cpufeatures
          crypto-common
          digest
          generic-array
          itoa
          libc
          memchr
          proc-macro2
          quote
          serde
          serde_core
          serde_derive
          serde_json
          sha2
          syn
          typenum
          unicode-ident
          version_check
          zmij
          EOF
          )"
          if [ "$actual" != "$expected" ]; then
            echo "External dependency inventory differs from docs/DEPENDENCIES.md"
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          echo "OK: locked external dependency inventory is documented."
