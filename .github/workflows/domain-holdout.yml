name: Domain holdout admission
on:
  pull_request:
    paths:
      - 'scripts/*domain_holdout*'
      - 'scripts/select_curriculum_probe.py'
      - 'crates/cogno-model/examples/rust_project_split.rs'
      - 'crates/cogno-model/examples/bpe_curriculum_probe.rs'
      - 'experiments/rust-curriculum/**'
      - '.github/workflows/domain-holdout.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/*domain_holdout*'
      - 'scripts/select_curriculum_probe.py'
      - 'crates/cogno-model/examples/rust_project_split.rs'
      - 'crates/cogno-model/examples/bpe_curriculum_probe.rs'
      - 'experiments/rust-curriculum/**'
      - '.github/workflows/domain-holdout.yml'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Fixed selection and grouping tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_domain_holdout*.py' -v
          python3 -m unittest discover -s scripts -p 'test_curriculum_probe_selection.py' -v
      - name: Recertify all 288 sources and admit domain groups
        run: |
          cargo build --release --locked -p cogno-model --example rust_project_split
          python3 scripts/prepare_domain_holdout.py "$RUNNER_TEMP/domain-holdout" --split-executable target/release/examples/rust_project_split --rustc "$(rustup which rustc)"
