name: Rust curriculum error_handling
on:
  pull_request:
    paths:
      - 'experiments/rust-curriculum/error_handling/**'
      - 'scripts/test_curriculum_error_handling.py'
      - 'scripts/admit_rust_corpus.py'
      - '.github/workflows/rust-curriculum-error_handling.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/rust-curriculum/error_handling/**'
      - 'scripts/test_curriculum_error_handling.py'
      - 'scripts/admit_rust_corpus.py'
      - '.github/workflows/rust-curriculum-error_handling.yml'
permissions:
  contents: read
concurrency:
  group: curriculum-error_handling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compiler-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Recompile every fixture and reject invalid evidence
        run: python3 -m unittest discover -s scripts -p 'test_curriculum_error_handling.py' -v
